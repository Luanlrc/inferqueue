services:
  postgres:
    image: postgres:16-alpine
    container_name: inferqueue-postgres
    environment:
      POSTGRES_USER: inferqueue
      POSTGRES_PASSWORD: inferqueue
      POSTGRES_DB: inferqueue
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inferqueue -d inferqueue"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
